schema-version = 1

[package]
title = "StePlayer"
version = "1.0.0"
# Floor so local builds pass vpt validate; pass an increasing --build-number for every Appstore upload.
build-number = 1
id = "com.steplayer.app"

[os.version]
min = "2.0"
target = "2.0"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# Lists and their streams are often plain http:// (most Xtream servers): without this the Vega media player refuses
# them ("HTTP URI detected, checking cleartext policy … Invalid or insecure URI scheme").
[network-traffic-policy.cleartext]
allowed-domains = ["*"]

[wants]
[[wants.module]]
id = "/com.amazon.kepler.net.net_manager@INetManager"

# On-screen keyboard for the text fields (list address, username, password, search).
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Media playback (react-native-w3cmedia), from the Vega media player setup guide.
[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[components]
[[components.interactive]]
id = "com.steplayer.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
