name: StePlayer
options:
  bundleIdPrefix: com.steplayer
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: it
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: A74N46H9NQ
    CODE_SIGN_STYLE: Automatic
    # Kotlin Multiplatform "Shared" framework produced by :shared:embedAndSignAppleFrameworkForXcode
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
    # Kotlin/Native simulator targets are arm64-only (Apple Silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targetTemplates:
  KotlinApp:
    preBuildScripts:
      - name: Build Kotlin Shared framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --configure-on-demand

targets:
  StePlayer:
    templates: [KotlinApp]
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/iOS
    dependencies:
      # VLCKit (LGPL 2.1) for containers AVPlayer can't decode. Fetched by scripts/fetch_vlckit.sh.
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: StePlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.steplayer.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDisplayName: StePlayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "StePlayer usa la rete locale per trasmettere video ai dispositivi AirPlay e per scambiare i dati della lista tra telefono e televisore."
        # Downloads stay private to the app: no Files app exposure, no "open in place".
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false

  StePlayerTV:
    templates: [KotlinApp]
    type: application
    platform: tvOS
    sources:
      - path: Sources
        excludes:
          - "Features/Downloads/**"
      - path: Resources/tvOS
    dependencies:
      - framework: Frameworks/TVVLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: StePlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.steplayer.app
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        INFOPLIST_FILE: Resources/tvOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/tvOS/Info.plist
      properties:
        CFBundleDisplayName: StePlayer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: "StePlayer usa la rete locale per ricevere dal tuo telefono i dati della lista."
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  StePlayer:
    build:
      preActions:
        # The VLCKit xcframeworks must exist before Xcode plans the build (fresh checkout).
        - script: "\"$SRCROOT/scripts/fetch_vlckit.sh\""
          settingsTarget: StePlayer
      targets:
        StePlayer: all
    run:
      config: Debug
    archive:
      config: Release
  StePlayerTV:
    build:
      preActions:
        # The VLCKit xcframeworks must exist before Xcode plans the build (fresh checkout).
        - script: "\"$SRCROOT/scripts/fetch_vlckit.sh\""
          settingsTarget: StePlayerTV
      targets:
        StePlayerTV: all
    run:
      config: Debug
    archive:
      config: Release
